[package]
name = "server"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
shared.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid = { workspace = true, features = ["v7"] }
chrono.workspace = true
anyhow = "1"
object_store = { version = "0.14", default-features = false, features = ["aws"] }
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "fs"] }
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.7", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
